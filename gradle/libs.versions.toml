[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.12"
composeBom = "2026.06.01"
activityCompose = "1.12.4"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
room = "2.8.4"
work = "2.11.2"
credentials = "1.6.0"
googleid = "1.2.1"
playServicesAuth = "21.6.0"
