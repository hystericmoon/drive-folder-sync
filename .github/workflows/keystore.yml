name: Generate signing keystore

# Run once, by hand. Produces a keystore + password as a short-lived artifact
# that you copy into repo secrets. The SHA-1 is printed in the run summary.
on:
  workflow_dispatch:
    inputs:
      confirm_replace:
        description: 'Type REPLACE to generate a new key even though one exists (changes the SHA-1; existing installs must be uninstalled).'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to replace an existing key
        env:
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
          CONFIRM: ${{ inputs.confirm_replace }}
        run: |
          if [ -n "$EXISTING" ] && [ "$CONFIRM" != "REPLACE" ]; then
            echo "::error::KEYSTORE_BASE64 is already set. Re-run with confirm_replace=REPLACE if you really want a new key."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          mkdir out
          PASSWORD=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore release.jks -alias drivesync \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Drive Folder Sync, O=Personal"
          base64 -w0 release.jks > out/KEYSTORE_BASE64.txt
          printf '%s' "$PASSWORD" > out/KEYSTORE_PASSWORD.txt
          SHA1=$(keytool -list -v -keystore release.jks -storepass "$PASSWORD" -alias drivesync | grep -m1 'SHA1:' | awk '{print $2}')
          echo "SHA-1: $SHA1"
          printf '%s\n' "$SHA1" > out/SHA1.txt
          {
            echo "### Keystore generated"
            echo ""
            echo "Signing SHA-1: \`$SHA1\`"
            echo ""
            echo "Download the **signing-secrets** artifact below (expires in 1 day) and copy each file's contents into the repo secret with the same name."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: out/
          retention-days: 1
