name: Build signed APK

on:
  push:
    branches: ['**']
  workflow_dispatch:
  # Weekly check that nothing outside the repo (dependencies, emulator images) broke the build.
  # Runs every test but publishes nothing.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

concurrency:
  # Scheduled runs get their own group so they never cancel a push build that's publishing a release.
  group: release-${{ github.ref }}-${{ github.event_name == 'schedule' && 'weekly' || 'push' }}
  cancel-in-progress: true

jobs:
  # Unit tests, then the signed APK. Runs in parallel with device-tests; nothing is published
  # unless both pass, so a failing test never reaches the phone.
  build:
    runs-on: ubuntu-latest
    outputs:
      sha1: ${{ steps.cert.outputs.sha1 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Runs before anything is built or published: a failing test stops the release, so the
      # app never auto-updates to it. Includes the end-to-end sync engine scenarios.
      - name: Run tests (a failure blocks the release)
        env:
          # Optional: lets LiveDriveTest run against a throwaway Google account (SETUP.md). Skipped when unset.
          DRIVE_TEST_CLIENT_ID: ${{ secrets.DRIVE_TEST_CLIENT_ID }}
          DRIVE_TEST_CLIENT_SECRET: ${{ secrets.DRIVE_TEST_CLIENT_SECRET }}
          DRIVE_TEST_REFRESH_TOKEN: ${{ secrets.DRIVE_TEST_REFRESH_TOKEN }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: List failed tests
        if: failure()
        run: python3 .github/scripts/test-summary.py "Unit tests failed, so nothing was released" "app/build/test-results/testDebugUnitTest/*.xml"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets missing. Run the 'Generate signing keystore' workflow once and add KEYSTORE_BASE64 and KEYSTORE_PASSWORD as repo secrets (see SETUP.md)."
            exit 1
          fi
          # Phone copy/paste often adds line breaks or spaces inside the long base64 line.
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n')
          echo "KEYSTORE_BASE64: ${#CLEAN} base64 characters after removing whitespace"
          if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 isn't valid base64 (it has ${#CLEAN} characters; a key from the keystore workflow is about 4,500). It was probably cut off or mangled when copied. Paste the whole contents of KEYSTORE_BASE64.txt into the secret again."
            exit 1
          fi
          PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
          echo "::add-mask::$PASSWORD"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASSWORD" -alias drivesync > /dev/null 2>&1; then
            echo "::error::Can't open the keystore. Either KEYSTORE_BASE64 was cut off when copied (it has ${#CLEAN} characters; expect about 4,500), or KEYSTORE_PASSWORD doesn't belong to the same keystore run. Re-paste both from the same signing-secrets zip."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::Repo variable GOOGLE_WEB_CLIENT_ID is not set; the app will build but sign-in won't work until it is (see SETUP.md step 6)."
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Print signing certificate (SHA-1 for Google Cloud)
        id: cert
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          SHA1=$(grep -m1 'SHA-1 digest' certs.txt | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          echo "SHA-1: $SHA1"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  # The app on an Android emulator: phone-storage code against the real provider, the sync engine
  # on real storage, launch, notifications, scheduling, and a crash check of the minified release build.
  # One job per Android version: the oldest the app supports (10), a common one (14), the newest (16).
  device-tests:
    name: device-tests (Android ${{ matrix.android }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 29, android: 10 }
          - { api: 34, android: 14 }
          - { api: 36, android: 16 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same R8 output as the real release, signed with a throwaway key (the real one stays in `build`).
      - name: Build test APKs
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -alias drivesync -keyalg RSA -keysize 2048 \
            -validity 2 -storepass throwaway -keypass throwaway -dname "CN=CI throwaway" > /dev/null
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/throwaway.jks" SIGNING_STORE_PASSWORD=throwaway
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest assembleRelease

      - name: Run emulator tests (a failure blocks the release)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell mkdir -p /sdcard/Download/drivesync-ci
            ./gradlew --no-daemon connectedDebugAndroidTest
            bash .github/scripts/smoke-release.sh app/build/outputs/apk/release/app-release.apk

      - name: List failed tests
        if: failure()
        run: python3 .github/scripts/test-summary.py "Emulator tests failed on Android ${{ matrix.android }}, so nothing was released" "app/build/outputs/androidTest-results/connected/**/*.xml"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: emulator-test-report-android-${{ matrix.android }}
          path: app/build/reports/androidTests/
          retention-days: 7

  release:
    needs: [build, device-tests]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA1: ${{ needs.build.outputs.sha1 }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          TAG="v$VERSION"
          cp app-release.apk "drive-folder-sync-$VERSION.apk"
          PRERELEASE=""
          if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" "drive-folder-sync-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "$VERSION ($BRANCH)" \
            --notes "Built from \`$BRANCH\` @ ${GITHUB_SHA:0:7}. Signing SHA-1: \`$SHA1\`" \
            $PRERELEASE
          {
            echo "### Drive Folder Sync $VERSION"
            echo ""
            echo "- Branch: \`$BRANCH\`"
            echo "- Signing SHA-1: \`$SHA1\`"
            echo "- Download: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
